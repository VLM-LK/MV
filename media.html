<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VLM Media</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* =========================
       LOADING SCREEN
    ========================= */
    .fix{
      position:absolute;
      top:10px;
      left:10px;
      z-index:10000;
      font-weight:700;
      color:white;
      font-size:20px;
    }
      
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #202020 0%, #090909 35%, #000 75%);
      transition: opacity .35s ease, visibility .35s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      text-align: center;
      color: white;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #ffffff, #777);
      color: #000;

      font-size: 30px;
      font-weight: 900;

      box-shadow:
        0 0 40px rgba(255,255,255,.15),
        inset 0 0 20px rgba(0,0,0,.15);

      animation: pulse 1.8s infinite ease-in-out;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;

      border: 3px solid rgba(255,255,255,.15);
      border-top-color: white;
      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    .loading-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .loading-text {
      font-size: 13px;
      color: #888;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    /* =========================
       MEDIA
    ========================= */

    #media {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;

      display: none;
    }

    /* =========================
       NO MEDIA
    ========================= */

    #noMedia {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at center, #181818 0%, #050505 55%, #000 100%);

      color: white;
      text-align: center;
      padding: 30px;
    }

    .empty-box {
      max-width: 320px;
    }

    .empty-icon {
      width: 78px;
      height: 78px;

      margin: 0 auto 22px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;

      font-size: 34px;

      box-shadow:
        0 0 35px rgba(255,255,255,.06);
    }

    .empty-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-text {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       ERROR
    ========================= */

    #error {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: #000;

      color: white;
      text-align: center;
      padding: 30px;
    }

    .error-box {
      max-width: 340px;
    }

    .error-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .error-text {
      color: #888;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="fix"></div>
  <!-- Loading -->
  <div id="loading">
    <div class="loader-box">

      <div class="logo">V</div>

      <div class="spinner"></div>

      <div class="loading-title">
        Loading media
      </div>

      <div class="loading-text">
        Please wait...
      </div>

    </div>
  </div>


  <!-- Full-screen image -->
  <img id="media" alt="Media">


  <!-- No media -->
  <div id="noMedia">
    <div class="empty-box">

      <div class="empty-icon">
        🖼️
      </div>

      <div class="empty-title">
        No Media
      </div>

      <div class="empty-text">
        The requested media could not be found.
      </div>

    </div>
  </div>


  <!-- Error -->
  <div id="error">
    <div class="error-box">

      <div class="error-icon">
        ⚠️
      </div>

      <div class="error-title">
        Something went wrong
      </div>

      <div class="error-text" id="errorText">
        Unable to load the media.
      </div>

    </div>
  </div>


<script>

  /* =========================================
     CONFIG
  ========================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxWY-Xamkgv9fNUeaYWpBluRLZR0ypekzd3hRIJ1fQ2Vuy7UPKQ-R9padpNNGcZC1cYFA/exec";


  /* =========================================
     TELEGRAM
  ========================================= */

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    // Dark Telegram UI
    tg.setHeaderColor("#000000");
    tg.setBackgroundColor("#000000");
  }


  /* =========================================
     ELEMENTS
  ========================================= */

  const loading = document.getElementById("loading");
  const media = document.getElementById("media");
  const noMedia = document.getElementById("noMedia");
  const error = document.getElementById("error");
  const errorText = document.getElementById("errorText");


  /* =========================================
     GET START PARAM
  ========================================= */

  function getStartParam() {

    // Telegram Mini App
    if (tg?.initDataUnsafe?.start_param) {
      return tg.initDataUnsafe.start_param;
    }

    // Fallback for testing in browser
    const params = new URLSearchParams(location.search);

    return (
      params.get("startapp") ||
      params.get("start") ||
      params.get("id")
    );
  }


  /* =========================================
     GET USER ID
  ========================================= */

  function getUserId() {

    if (tg?.initDataUnsafe?.user?.id) {
      return String(tg.initDataUnsafe.user.id);
    }

    return null;
  }


  /* =========================================
     HIDE LOADING
  ========================================= */

  function hideLoading() {
    loading.classList.add("hide");
  }


  /* =========================================
     SHOW NO MEDIA
  ========================================= */

  function showNoMedia() {

    hideLoading();

    noMedia.style.display = "flex";
  }


  /* =========================================
     SHOW ERROR
  ========================================= */

  function showError(message) {

    hideLoading();

    errorText.textContent = message || "Unable to load the media.";

    error.style.display = "flex";
  }


  /* =========================================
     LOAD MEDIA
  ========================================= */

  async function loadMedia() {

    try {

      const mediaId = getStartParam() || "";
      const userId = getUserId() || "000000000";

      document.querySelector(".fix").inneHTML=`${mediaId} * ${userId}`;

      if (!mediaId) {
        showNoMedia();
        return;
      }

      if (!userId) {
        showError("Telegram user information is unavailable.");
        return;
      }


      /*
       * GET:
       *
       * ?id=MEDIA_ID&user_id=TELEGRAM_USER_ID
       */

      const url =
        API_URL +"?action=getUrl"+
        "&slug=" + encodeURIComponent(mediaId) +
        "&uid=" + encodeURIComponent(userId);


      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });


      if (!response.ok) {
        throw new Error("Server returned " + response.status);
      }


      const data = await response.json();
      console.log(JSON.stringify(data));

      /*
       * Expected:
       *
       * {
       *   "url": "https://example.com/image.jpg"
       * }
       *
       * OR
       *
       * {
       *   "url": null
       * }
       */


      if (!data || !data.url) {
        showNoMedia();
        return;
      }


      /*
       * Test that image can actually load
       */

      media.onload = function() {

        hideLoading();

        media.style.display = "block";
      };


      media.onerror = function() {

        showError("The media URL could not be loaded.");
      };


      media.src = data.url;

    } catch (err) {

      console.error(err);

      showError("Unable to connect to the media server.");
    }
  }


  /* =========================================
     START
  ========================================= */

  loadMedia();

</script>

</body>
  </html>
